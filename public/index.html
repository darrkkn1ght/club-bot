<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quilox & Club Spender Bot</title>
  <style>
    :root {
      --bg: #0b0b12;
      --card: #151522;
      --card-2: #1d1d2e;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --gold: #f59e0b;
      --gold-2: #d97706;
      --green: #22c55e;
      --red: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1f1438 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px 14px 96px;
    }
    .wrap { max-width: 540px; margin: 0 auto; }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      display: grid; place-items: center; font-size: 20px; color: #111;
    }
    .brand h1 { margin: 0; font-size: 1.15rem; font-weight: 800; }
    .brand p { margin: 0; font-size: 0.78rem; color: var(--muted); }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 16px; margin-bottom: 14px;
    }
    .hidden { display: none !important; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .tab {
      height: 44px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card-2); color: var(--muted); font-weight: 700; cursor: pointer;
    }
    .tab.active { background: var(--gold); color: #111; border-color: transparent; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    input, select, textarea {
      width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card-2); color: var(--text); padding: 12px; font-size: 1rem;
      margin-bottom: 12px; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--gold); }
    .btn {
      width: 100%; min-height: 50px; border: none; border-radius: 14px;
      font-size: 1rem; font-weight: 800; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: #111; }
    .btn-sec { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: rgba(239,68,68,0.18); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
    .btn-sm { min-height: 38px; padding: 0 12px; font-size: 0.85rem; width: auto; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .stat-box { background: var(--card-2); border-radius: 12px; padding: 12px; }
    .stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; }
    .stat-val { font-size: 1.05rem; font-weight: 800; margin-top: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
      min-height: 40px; padding: 0 14px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--card-2); color: var(--text);
      font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }
    .chip.active { background: var(--gold); color: #111; border-color: transparent; }
    .item-list { display: grid; gap: 8px; max-height: 280px; overflow-y: auto; margin-bottom: 12px; }
    .item-btn {
      width: 100%; text-align: left; padding: 12px; border-radius: 12px;
      background: var(--card-2); border: 1.5px solid var(--border); color: var(--text);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer;
    }
    .item-btn.active { border-color: var(--gold); background: rgba(245,158,11,0.12); }
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 800;
    }
    .badge-open { background: rgba(34,197,94,0.18); color: #86efac; }
    .badge-closed { background: rgba(239,68,68,0.18); color: #fca5a5; }
    .progress { height: 10px; background: var(--card-2); border-radius: 999px; overflow: hidden; margin: 10px 0; }
    .progress > div { height: 100%; background: linear-gradient(90deg, var(--gold), #22c55e); transition: width 0.25s; }
    .logs {
      background: #09090f; border-radius: 10px; padding: 10px; font-family: monospace;
      font-size: 0.76rem; color: #cbd5e1; max-height: 140px; overflow-y: auto; line-height: 1.45;
    }
    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: #1e293b; color: #fff; padding: 12px 18px; border-radius: 12px;
      border: 1px solid var(--border); font-weight: 700; font-size: 0.9rem; z-index: 99;
      max-width: 92vw; text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">🍾</div>
        <div>
          <h1>Club & Quilox Bot</h1>
          <p id="brandSub">Mobile Auto-Spender</p>
        </div>
      </div>
      <button id="logoutBtn" class="btn btn-sec btn-sm hidden">Sign Out</button>
    </div>

    <!-- AUTH VIEW -->
    <div id="authCard" class="card">
      <div id="accessKeyWrap" class="hidden">
        <label>License / Access Key</label>
        <input id="accessKey" type="password" placeholder="Enter your license key" autocomplete="off" />
      </div>

      <div class="tabs">
        <button class="tab active" data-auth="creds">Username & Pass</button>
        <button class="tab" data-auth="cookie">Session Cookie</button>
      </div>

      <div id="credsTab">
        <label>LagosLife Username</label>
        <input id="username" type="text" placeholder="@username" autocomplete="username" autocapitalize="none" />
        <label>Password</label>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
        <div id="twoFaWrap" class="hidden">
          <label id="twoFaLabel">2FA Code</label>
          <input id="twoFaCode" type="text" inputmode="numeric" placeholder="6-digit code" />
        </div>
        <button id="loginBtn" class="btn btn-gold">Sign In</button>
      </div>

      <div id="cookieTab" class="hidden">
        <label>Paste LagosLife Session Cookie</label>
        <textarea id="cookieInput" rows="3" placeholder="ll_session=...; ll_pass=..."></textarea>
        <button id="cookieBtn" class="btn btn-gold">Connect Cookie</button>
      </div>
    </div>

    <!-- APP VIEW -->
    <div id="appView" class="hidden">
      <div class="card">
        <div class="stat-row">
          <div class="stat-box">
            <div class="stat-label">Wallet (<span id="userHandle">@user</span>)</div>
            <div class="stat-val" id="walletVal">₦0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">In-Game Time</div>
            <div class="stat-val" id="gameTimeVal">--:--</div>
          </div>
        </div>
        <p style="margin:0;font-size:0.78rem;color:var(--muted);">
          Tip: Stay in Quilox on LagosLife in another tab to watch &amp; chat live while this runs.
        </p>
      </div>

      <div class="card">
        <label>1. Choose Club / Venue <span id="clubOpenBadge" class="badge"></span></label>
        <select id="clubSelect"></select>

        <label>2. Choose What to Buy</label>
        <div id="itemList" class="item-list"></div>

        <label>3. Quantity</label>
        <div class="chips" id="qtyChips">
          <button type="button" class="chip" data-q="5">5x</button>
          <button type="button" class="chip active" data-q="20">20x</button>
          <button type="button" class="chip" data-q="50">50x</button>
          <button type="button" class="chip" data-q="100">100x</button>
        </div>
        <input id="qtyInput" type="number" min="1" max="500" value="20" inputmode="numeric" />

        <label>4. Speed</label>
        <select id="speedSelect">
          <option value="500">⚡ Fast (0.5s / buy)</option>
          <option value="1000" selected>🚀 Normal (1.0s / buy)</option>
          <option value="2000">🥂 Chill (2.0s / buy)</option>
        </select>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">
          <label style="margin:0;display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input id="autoWait" type="checkbox" style="width:20px;min-height:20px;margin:0;" checked />
            Auto-wait if club is closed (10 PM)
          </label>
          <div style="font-weight:800;color:var(--gold);" id="totalPreview">Total: ₦0</div>
        </div>

        <button id="startBtn" class="btn btn-gold">🚀 Start Auto-Spending</button>
      </div>

      <div id="jobsWrap"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const TOKEN_KEY = "club_bot_token";
    let clubs = [];
    let selectedClubId = "clubEko";
    let selectedItemId = "clubTakeover";
    let clubOpenMap = {};
    let twoFaChallenge = "";
    let pollTimer = null;

    function fmtNaira(n) {
      const v = Number(n || 0);
      if (v >= 1e12) return "₦" + (v / 1e12).toFixed(2) + "T";
      if (v >= 1e9) return "₦" + (v / 1e9).toFixed(2) + "B";
      if (v >= 1e6) return "₦" + (v / 1e6).toFixed(2) + "M";
      return "₦" + v.toLocaleString("en-NG");
    }

    function escHtml(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.add("hidden"), 3200);
    }

    function getToken() {
      try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
    }
    function setToken(t) {
      try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {}
    }

    async function api(url, opts = {}) {
      const t = getToken();
      const res = await fetch(url, {
        ...opts,
        headers: {
          "Content-Type": "application/json",
          ...(t ? { "x-bot-token": t } : {}),
          ...(opts.headers || {})
        }
      });
      const d = await res.json().catch(() => ({}));
      if (res.status === 401) {
        showAuth();
        throw new Error(d.error || "Please log in.");
      }
      if (!res.ok) throw new Error(d.error || "Request failed.");
      return d;
    }

    function showAuth() {
      $("authCard").classList.remove("hidden");
      $("appView").classList.add("hidden");
      $("logoutBtn").classList.add("hidden");
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    function showApp() {
      $("authCard").classList.add("hidden");
      $("appView").classList.remove("hidden");
      $("logoutBtn").classList.remove("hidden");
      refreshStatus();
      if (!pollTimer) pollTimer = setInterval(refreshStatus, 2000);
    }

    document.querySelectorAll(".tab").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        const isCreds = b.dataset.auth === "creds";
        $("credsTab").classList.toggle("hidden", !isCreds);
        $("cookieTab").classList.toggle("hidden", isCreds);
      });
    });

    $("loginBtn").addEventListener("click", async () => {
      $("loginBtn").disabled = true;
      try {
        if (twoFaChallenge) {
          const d = await api("/api/auth/2fa", {
            method: "POST",
            body: JSON.stringify({
              challenge: twoFaChallenge,
              code: $("twoFaCode").value.trim(),
              accessKey: $("accessKey").value.trim()
            })
          });
          setToken(d.token);
          twoFaChallenge = "";
          showApp();
        } else {
          const d = await api("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({
              username: $("username").value.trim(),
              password: $("password").value,
              accessKey: $("accessKey").value.trim()
            })
          });
          if (d.twoFactor) {
            twoFaChallenge = d.challenge;
            $("twoFaWrap").classList.remove("hidden");
            $("twoFaLabel").textContent = `2FA Code (${d.to || d.method})`;
            toast("Enter your 2FA code.");
          } else {
            setToken(d.token);
            showApp();
          }
        }
      } catch (e) {
        toast(e.message);
      } finally {
        $("loginBtn").disabled = false;
      }
    });

    $("cookieBtn").addEventListener("click", async () => {
      $("cookieBtn").disabled = true;
      try {
        const d = await api("/api/auth/cookie", {
          method: "POST",
          body: JSON.stringify({
            cookie: $("cookieInput").value.trim(),
            accessKey: $("accessKey").value.trim()
          })
        });
        setToken(d.token);
        showApp();
      } catch (e) {
        toast(e.message);
      } finally {
        $("cookieBtn").disabled = false;
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      await fetch("/api/auth/logout", { method: "POST", headers: { "x-bot-token": getToken() } }).catch(() => {});
      setToken("");
      showAuth();
    });

    function renderClubs() {
      $("clubSelect").innerHTML = clubs
        .map((c) => `<option value="${c.id}">${c.emoji} ${c.name} (${c.city})</option>`)
        .join("");
      $("clubSelect").value = selectedClubId;
      renderItems();
    }

    function updateOpenBadge() {
      const club = clubs.find((c) => c.id === selectedClubId) || clubs[0];
      if (!club) return;
      const isOpen = clubOpenMap[club.id] !== false;
      const badge = $("clubOpenBadge");
      badge.textContent = club.hours ? (isOpen ? "OPEN NOW" : "CLOSED (OPENS 10 PM)") : "OPEN 24H";
      badge.className = "badge " + (isOpen ? "badge-open" : "badge-closed");
    }

    function renderItems() {
      const club = clubs.find((c) => c.id === selectedClubId) || clubs[0];
      if (!club) return;
      if (!club.items.some((i) => i.id === selectedItemId)) {
        selectedItemId = club.items[0]?.id || "";
      }
      updateOpenBadge();

      $("itemList").innerHTML = club.items
        .map(
          (i) => `
          <button type="button" class="item-btn ${i.id === selectedItemId ? "active" : ""}" data-id="${i.id}">
            <span>${i.emoji} <strong>${i.label}</strong></span>
            <span style="font-weight:800;color:var(--gold);white-space:nowrap;">${fmtNaira(i.cost)}</span>
          </button>`
        )
        .join("");

      $("itemList").querySelectorAll(".item-btn").forEach((b) => {
        b.addEventListener("click", () => {
          selectedItemId = b.dataset.id;
          renderItems();
          updateTotal();
        });
      });
      updateTotal();
    }

    function updateTotal() {
      const club = clubs.find((c) => c.id === selectedClubId);
      const item = club?.items.find((i) => i.id === selectedItemId);
      const q = Math.max(1, Number($("qtyInput").value) || 1);
      $("totalPreview").textContent = "Total: " + fmtNaira((item?.cost || 0) * q);
    }

    $("clubSelect").addEventListener("change", (e) => {
      selectedClubId = e.target.value;
      renderItems();
    });

    $("qtyChips").querySelectorAll(".chip").forEach((c) => {
      c.addEventListener("click", () => {
        $("qtyChips").querySelectorAll(".chip").forEach((x) => x.classList.remove("active"));
        c.classList.add("active");
        $("qtyInput").value = c.dataset.q;
        updateTotal();
      });
    });
    $("qtyInput").addEventListener("input", updateTotal);

    $("startBtn").addEventListener("click", async () => {
      $("startBtn").disabled = true;
      try {
        await api("/api/spend/start", {
          method: "POST",
          body: JSON.stringify({
            clubId: selectedClubId,
            itemId: selectedItemId,
            quantity: Number($("qtyInput").value) || 1,
            delayMs: Number($("speedSelect").value) || 1000,
            autoWait: $("autoWait").checked
          })
        });
        toast("Auto-spender started!");
        refreshStatus();
      } catch (e) {
        toast(e.message);
      } finally {
        $("startBtn").disabled = false;
      }
    });

    window.__ctrlJob = async (jobId, action) => {
      try {
        await api("/api/spend/control", { method: "POST", body: JSON.stringify({ jobId, action }) });
        refreshStatus();
      } catch (e) {
        toast(e.message);
      }
    };

    async function refreshStatus() {
      try {
        const d = await api("/api/status");
        $("userHandle").textContent = "@" + (d.user?.username || "player");
        $("walletVal").textContent = fmtNaira(d.balance);
        $("gameTimeVal").textContent = d.gameTime || "--:--";
        clubOpenMap = d.clubOpenMap || {};
        updateOpenBadge();

        $("jobsWrap").innerHTML = (d.jobs || [])
          .map((j) => {
            const pct = Math.min(100, Math.round((j.bought / Math.max(1, j.quantity)) * 100));
            const active = j.status === "RUNNING" || j.status === "WAITING_OPEN" || j.status === "PAUSED";
            return `
            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                <strong>${j.clubName} · ${j.itemLabel}</strong>
                <span class="badge ${j.status === "COMPLETED" ? "badge-open" : "badge-closed"}">${j.status} (${j.bought}/${j.quantity})</span>
              </div>
              <div class="progress"><div style="width:${pct}%"></div></div>
              <div style="font-size:0.85rem;color:var(--gold);font-weight:700;margin-bottom:8px;">Spent: ${fmtNaira(j.spent)}</div>
              ${
                active
                  ? `<div style="display:flex;gap:8px;margin-bottom:8px;">
                      <button class="btn btn-sec btn-sm" onclick="window.__ctrlJob('${j.id}','${j.status === "PAUSED" ? "resume" : "pause"}')">${j.status === "PAUSED" ? "Resume" : "Pause"}</button>
                      <button class="btn btn-danger btn-sm" onclick="window.__ctrlJob('${j.id}','stop')">Stop</button>
                    </div>`
                  : ""
              }
              <div class="logs">${(j.logs || []).slice(-6).map((l) => `<div>${escHtml(l)}</div>`).join("")}</div>
            </div>`;
          })
          .join("");
      } catch {}
    }

    (async () => {
      const [c, cfg] = await Promise.all([
        fetch("/api/clubs").then((r) => r.json()).catch(() => ({ clubs: [] })),
        fetch("/api/auth/config").then((r) => r.json()).catch(() => ({}))
      ]);
      if (cfg.requireAccessKey) $("accessKeyWrap").classList.remove("hidden");
      if (cfg.licensedOnly) $("brandSub").textContent = "Licensed Single-User Edition 🔒";
      clubs = c.clubs || [];
      renderClubs();
      if (getToken()) showApp();
      else showAuth();
    })();
  </script>
</body>
</html>
